server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/dcare_db
spring.datasource.username=dcare_user
spring.datasource.password=dcare_secure_pass_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Cache Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
dcare.storage.upload-dir=/Users/praveensaravanan/Desktop/DCARE_Final_Year_Project/uploaded-documents

# AI Service Integration
dcare.ai-service.url=http://localhost:8000

# JWT Security Configuration
dcare.jwt.secret=dcare_super_secure_jwt_secret_key_2026_dcare_platform_jwt_token_auth_32_bytes_min
dcare.jwt.expiration-ms=86400000

# Logging
logging.level.com.dcare=INFO
logging.level.org.springframework.security=WARN
